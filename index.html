<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Othello</title>
  <style>
    :root {
      --felt: #1f7a45;
      --felt-dark: #14532e;
      --ink: #e9f6ee;
      --muted: #b7d4c2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: radial-gradient(ellipse at top, #1b3a28 0%, #0b1611 55%, #070d0a 100%);
    }
    .wrap { width: min(94vw, 560px); padding: 18px 16px 22px; }
    h1 {
      margin: 0 0 4px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 22px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }
    .panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
    }
    .score { display: flex; gap: 14px; font-size: 14px; }
    .chip { display: flex; align-items: center; gap: 7px; }
    .mini { width: 13px; height: 13px; border-radius: 50%; }
    .mini.b { background: radial-gradient(circle at 30% 30%, #555, #111); }
    .mini.w { background: radial-gradient(circle at 30% 30%, #fff, #ccc); }
    #status { font-size: 13px; color: #d7efe0; }
    .board-frame {
      padding: 14px;
      border-radius: 16px;
      background: linear-gradient(160deg, #6b4a2b, #3b2414 45%, #2a180c);
      box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.2);
    }
    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      aspect-ratio: 1;
      background: #0e3b22;
      border-radius: 6px;
      overflow: hidden;
    }
    .cell {
      position: relative;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.08), transparent 36%),
        linear-gradient(#21814a, var(--felt-dark));
      border: 1px solid rgba(8, 40, 22, .55);
    }
    .cell.valid { cursor: pointer; }
    .cell.valid:after {
      content: "";
      position: absolute;
      inset: 34%;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.55);
      pointer-events: none;
    }
    .disc {
      position: absolute;
      inset: 9%;
      border-radius: 50%;
    }
    .disc.black {
      background: radial-gradient(circle at 32% 28%, #6d6d6d 0%, #222 38%, #0a0a0a 70%);
      box-shadow: inset 0 -6px 10px rgba(0,0,0,.55), 0 4px 7px rgba(0,0,0,.4);
    }
    .disc.white {
      background: radial-gradient(circle at 32% 28%, #fff 0%, #f0f0f0 38%, #c8c8c8 78%);
      box-shadow: inset 0 -6px 8px rgba(0,0,0,.16), 0 4px 7px rgba(0,0,0,.28);
    }
    .disc.pop { animation: pop .22s ease; }
    @keyframes pop {
      0% { transform: scale(.2); }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }
    button, select {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      font: 13px/1.2 Georgia, serif;
      cursor: pointer;
    }
    button {
      background: linear-gradient(#3aa66a, #217448);
      color: #fff;
      box-shadow: 0 3px 0 #145332;
    }
    button:hover { filter: brightness(1.06); }
    button:disabled { opacity: .45; cursor: default; filter: none; }
    select {
      background: #173324;
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.12);
    }
    #msg {
      min-height: 1.2em;
      margin-top: 10px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Othello</h1>
    <div class="subtitle">You are Black · computer is White</div>
    <div class="panel">
      <div class="score">
        <span class="chip"><span class="mini b"></span> Black <strong id="bs">2</strong></span>
        <span class="chip"><span class="mini w"></span> White <strong id="ws">2</strong></span>
      </div>
      <div
